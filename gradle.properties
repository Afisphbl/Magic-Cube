# Project-wide Gradle settings.

# JVM heap for the Gradle daemon: sufficient for Filament/SceneView compilation
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Use AndroidX libraries (required for SceneView and all modern Jetpack)
android.useAndroidX=true

# Non-transitive R classes: safer, faster builds
android.nonTransitiveRClass=true

# Official Kotlin code style
kotlin.code.style=official

# Enable Gradle build cache for faster incremental builds
org.gradle.caching=true

# Parallel project execution
org.gradle.parallel=true
